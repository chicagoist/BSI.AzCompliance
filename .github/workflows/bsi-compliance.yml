name: BSI Compliance Check

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '**.ps1'
      - '**.psd1'
      - 'Data/**'
      - '.github/workflows/bsi-compliance.yml'
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  local-validation:
    name: Local BSI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Module and Run Local Checks
        shell: pwsh
        run: |
          Import-Module ./BSI.AzCompliance.psd1 -Force
          $deployScript = Get-ChildItem -Recurse -Filter 'create_3-tier*.ps1' | Select-Object -First 1
          if ($deployScript) {
            Invoke-BsiCompliance -Local -ScriptPath $deployScript.FullName -OutputFormat Console,Sarif -OutputPath ./reports/local-bsi
          } else {
            Write-Warning 'No deployment script found; skipping Local checks'
            exit 0
          }

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ./reports/local-bsi.sarif
          category: bsi-local-validation

  remote-validation:
    name: Remote BSI Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: azure-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Remote Compliance Check
        shell: pwsh
        run: |
          Import-Module ./BSI.AzCompliance.psd1 -Force
          Invoke-BsiCompliance -Remote -ConfigPath ./scripts/config.ps1 -OutputFormat Console,Sarif,Html,Json -OutputPath ./reports/remote-compliance

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ./reports/remote-compliance.sarif
          category: bsi-remote-validation

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bsi-compliance-report
          path: ./reports/remote-compliance.html
          retention-days: 30

      - name: Upload JSON Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bsi-compliance-json
          path: ./reports/remote-compliance.json
          retention-days: 30
